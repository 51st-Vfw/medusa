name: Medusa BKE Release

on:
    push:
        tags:
            - 'BKEv*.*.*'

env:
    ARTIFACT_NAME: medusa-bke-thin.lua
    BUNDLED_ARTIFACT_NAME: medusa-bke.lua
    ARTIFACT_ZIP: medusa-bke-thin.zip
    BUNDLED_ARTIFACT_ZIP: medusa-bke.zip
    BUILD_DIR: ./dist
    RELEASE_DIR: ./dist/release
    RELEASE_BRANCH: black-knight-edition

permissions: {}

jobs:
    release-guard:
        name: Guard - Tag points to black-knight-edition
        runs-on: ubuntu-24.04
        permissions:
            contents: read
        outputs:
            on_release_branch: ${{ steps.check.outputs.on_release_branch }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
              with:
                  fetch-depth: 0
            - name: Determine if tag commit is on black-knight-edition
              id: check
              shell: bash
              run: |
                  git fetch --no-tags --prune origin "+refs/heads/$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"
                  if git merge-base --is-ancestor "$GITHUB_SHA" "origin/$RELEASE_BRANCH"; then
                    echo "on_release_branch=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "on_release_branch=false" >> "$GITHUB_OUTPUT"
                  fi

    validate:
        name: Validate release
        runs-on: ubuntu-24.04
        needs: release-guard
        if: needs.release-guard.outputs.on_release_branch == 'true'
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
              with:
                  fetch-depth: 0

            - name: Setup Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0

            - name: Setup Task
              uses: arduino/setup-task@e26d8975574116b0097a1161e0fe16ba75d84c1c # v1.0.3
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Lua ${{ env.LUA_VERSION }}
              uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
              with:
                luaVersion: "5.1"

            - name: Verify tag matches pyproject.toml version
              env:
                REF_NAME: ${{ github.ref_name }}
              shell: bash
              run: |
                  set -e
                  TAG_VERSION="${REF_NAME#BKEv}"
                  FILE_VERSION=$(python -c "
                  import re; from pathlib import Path
                  m = re.search(r'version\s*=\s*\"(\d+\.\d+\.\d+)\"', Path('pyproject.toml').read_text())
                  print(m.group(1) if m else '')
                  ")
                  if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
                    echo "::error::Tag version ($TAG_VERSION) does not match pyproject.toml ($FILE_VERSION)"
                    exit 1
                  fi
                  echo "Version match: $TAG_VERSION"

            - name: Verify changelog section is non-empty
              env:
                REF_NAME: ${{ github.ref_name }}
              shell: bash
              run: |
                  set -e
                  VERSION="${REF_NAME#BKEv}"
                  SECTION=$(python -c "
                  import re; from pathlib import Path
                  content = Path('CHANGELOG.md').read_text()
                  version = '$VERSION'
                  pat = re.compile(rf'(?ms)^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)')
                  m = pat.search(content)
                  body = m.group(1).strip() if m else ''
                  has_entries = bool(re.search(r'^\s*[-*]', body, re.MULTILINE))
                  print('yes' if has_entries else 'no')
                  ")
                  if [ "$SECTION" != "yes" ]; then
                    echo "::error::CHANGELOG.md has no entries for version $VERSION"
                    exit 1
                  fi
                  echo "Changelog section for $VERSION is non-empty"

            - name: Format check
              run: task format:ci

            - name: Test
              run: task test

            - name: Build
              run: task build

            - name: Syntax check
              run: task syntax:check

            - name: Verify version stamped
              run: |
                for placeholder in '{{VERSION}}' '{{MEDUSA_BASE}}'; do
                  for artifact in '${{ env.ARTIFACT_NAME }}' '${{ env.BUNDLED_ARTIFACT_NAME }}'; do
                    if grep -qF "$placeholder" "${{ env.BUILD_DIR }}/$artifact"; then
                      echo "::error::$placeholder placeholder found in $artifact"
                      exit 1
                    fi
                  done
                done

            - name: Lint thin
              uses: YoloWingPixie/selene-lua-linter-action@24ecf180fd5bb4d3b40b4296de61b32179cb79d1 # v1
              with:
                config-path: 'selene.toml'
                lint-path: '${{ env.BUILD_DIR }}/${{ env.ARTIFACT_NAME }}'
                report-as-annotations: 'true'
                selene-args: '--allow-warnings'
                working-directory: '.'

            - name: Lint bundled
              uses: YoloWingPixie/selene-lua-linter-action@24ecf180fd5bb4d3b40b4296de61b32179cb79d1 # v1
              with:
                config-path: 'selene-bundled.toml'
                lint-path: '${{ env.BUILD_DIR }}/${{ env.BUNDLED_ARTIFACT_NAME }}'
                report-as-annotations: 'true'
                selene-args: '--allow-warnings'
                working-directory: '.'

    release:
        name: Release on black-knight-edition tags only
        runs-on: ubuntu-24.04
        needs: validate
        permissions:
            contents: write
        steps:
            - name: Checkout
              id: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
              with:
                  fetch-depth: 0

            - name: Setup Python
              id: setup-python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0

            - name: Setup Task
              id: setup-task
              uses: arduino/setup-task@e26d8975574116b0097a1161e0fe16ba75d84c1c # v1.0.3
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Prepare release artifacts
              run: task release:package

            - name: Extract release notes
              id: notes
              env:
                REF_NAME: ${{ github.ref_name }}
              shell: bash
              run: |
                  python ./scripts/build/extract_changelog_section.py "$REF_NAME" CHANGELOG.md RELEASE_NOTES.md

            # BKEv0.y.z tags publish a pre-release (BKE is a beta while its major version is 0), never marked
            # latest; BKEv1.0.0 and later publish a normal release marked latest.
            - name: Decide release kind
              id: kind
              env:
                REF_NAME: ${{ github.ref_name }}
              shell: bash
              run: |
                  python ./scripts/build/release_kind.py "$REF_NAME" >> "$GITHUB_OUTPUT"

            - name: Create GitHub Release
              uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
              with:
                name: '${{ github.ref_name }} - Medusa IADS - Black Knight Edition'
                make_latest: ${{ steps.kind.outputs.make_latest }}
                prerelease: ${{ steps.kind.outputs.prerelease }}
                draft: false
                body_path: RELEASE_NOTES.md
                fail_on_unmatched_files: true
                files: |
                    ${{ env.RELEASE_DIR }}/${{ env.BUNDLED_ARTIFACT_NAME }}
                    ${{ env.RELEASE_DIR }}/${{ env.ARTIFACT_NAME }}
                    ${{ env.RELEASE_DIR }}/${{ env.BUNDLED_ARTIFACT_ZIP }}
                    ${{ env.RELEASE_DIR }}/${{ env.ARTIFACT_ZIP }}
                    ${{ env.RELEASE_DIR }}/SHA256SUMS.txt
                    LICENSE
