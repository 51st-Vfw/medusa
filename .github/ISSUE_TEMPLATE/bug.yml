name: Bug Report
description: Something isn't working right in Medusa IADS - Black Knight Edition (BKE)
labels: ["bug"]
body:
    - type: markdown
      attributes:
          value: |
              This tracker is for Medusa IADS - Black Knight Edition (BKE), the customised Medusa build of the 667th Black Knights and the 51st VFW.
              If the problem also happens with official Medusa IADS, please report it upstream at https://github.com/medusa-iads/medusa/issues instead.
              51st VFW and 667th members can also raise BKE problems with Blackdog of the 667th.

    - type: textarea
      id: what-happened
      attributes:
          label: What happened?
          description: Describe the bug and what you expected instead.
      validations:
          required: true

    - type: input
      id: medusa-version
      attributes:
          label: Medusa BKE version
          description: The first Medusa line in dcs.log names it, e.g. "Medusa IADS - Black Knight Edition (BKE) v0.1.0 (based on Medusa v1.6.0)".
          placeholder: "0.1.0"
      validations:
          required: true

    - type: textarea
      id: medusa-config
      attributes:
          label: Configuration
          description: Copy and paste your Medusa configuration here.
      validations:
          required: true

    - type: input
      id: dcs-version
      attributes:
          label: DCS World version
          placeholder: "2.9.12.1234"

    - type: textarea
      id: dcs-log
      attributes:
          label: Log file
          description: Attach your dcs.log or relevant Medusa logs as a plaintext file. Please remove all personal information like usernames in directory paths before doing so.
